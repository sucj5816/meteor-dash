<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>流星突围 Meteor Dash</title>
  <style>
    :root { --ink:#e9f4ff; --muted:#91a6c6; --panel:rgba(12,22,48,.78); --line:rgba(140,190,255,.18); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; color:var(--ink); background:#050817; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
    .shell { width:min(100vw, 1100px); padding:20px; }
    .top { display:flex; justify-content:space-between; align-items:end; gap:16px; margin:0 auto 12px; max-width:940px; }
    h1 { margin:0; letter-spacing:.08em; font-size:clamp(24px,4vw,42px); line-height:1; text-shadow:0 0 24px #49b8ff66; }
    .subtitle { margin:8px 0 0; color:var(--muted); font-size:13px; }
    .stats { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .stat { min-width:86px; padding:8px 12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); text-align:center; backdrop-filter:blur(10px); }
    .stat small { display:block; color:var(--muted); font-size:11px; }
    .stat b { font-size:20px; }
    .game-wrap { position:relative; width:min(940px,100%); margin:auto; border:1px solid #6dbaff44; border-radius:20px; box-shadow:0 0 60px #1d72c522, inset 0 0 30px #6ab8ff08; overflow:hidden; background:#080e22; }
    canvas { display:block; width:100%; aspect-ratio:3 / 2; cursor:crosshair; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(180deg,#05081755,#050817cc); padding:20px; }
    .card { width:min(430px,100%); padding:30px; border:1px solid #88c8ff44; border-radius:20px; background:rgba(10,19,43,.88); box-shadow:0 18px 80px #0008; text-align:center; backdrop-filter:blur(12px); }
    .card h2 { margin:0 0 10px; font-size:30px; }
    .card p { color:#b8c8e4; line-height:1.7; margin:8px 0 20px; }
    button { border:0; border-radius:999px; padding:12px 24px; color:#061124; background:linear-gradient(135deg,#75e5ff,#9d9bff); font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 8px 24px #61d7ff44; transition:.18s transform,.18s filter; }
    button:hover { transform:translateY(-2px); filter:brightness(1.1); }
    .difficulty-label { margin:0 0 8px; color:#91a6c6; font-size:12px; }
    .difficulty-row { display:flex; justify-content:center; gap:8px; margin:0 0 18px; }
    .difficulty-btn { padding:8px 14px; color:#bcd5f6; background:#10254a; border:1px solid #6b9dd844; box-shadow:none; font-size:12px; }
    .difficulty-btn.selected { color:#061124; background:linear-gradient(135deg,#75e5ff,#9d9bff); border-color:transparent; }
    .wallet { display:flex; align-items:center; justify-content:center; gap:10px; margin:-4px 0 16px; color:#ffe78a; font-size:14px; }
    .shop-open { padding:7px 12px; color:#ffe78a; background:#3f2c58; border:1px solid #ffe78a55; box-shadow:none; font-size:12px; }
    .shop-card { width:min(620px,100%); max-height:min(560px,90vh); overflow:auto; }
    .shop-card h2 { margin-bottom:4px; }
    .shop-subtitle { margin:0 0 16px !important; font-size:12px; }
    .shop-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; text-align:left; }
    .shop-item { padding:13px; border:1px solid #86bcf033; border-radius:14px; background:#0e2042cc; }
    .shop-item h3 { margin:0 0 5px; font-size:15px; }
    .shop-item p { min-height:38px; margin:0 0 10px; font-size:12px; line-height:1.5; }
    .shop-item .price { color:#ffe78a; }
    .shop-item button { width:100%; padding:8px 10px; font-size:12px; }
    .shop-item button:disabled { color:#91a6c6; background:#263653; box-shadow:none; cursor:default; }
    .shop-close { margin-top:16px; padding:9px 18px; color:#cce5ff; background:#1c3257; box-shadow:none; font-size:13px; }
    .item-controls { position:absolute; top:16px; right:16px; display:flex; gap:6px; z-index:3; }
    .item-controls button { min-width:54px; padding:7px 8px; color:#e9f7ff; background:#142f5bcc; border:1px solid #91dcff55; box-shadow:0 4px 14px #0005; font-size:12px; touch-action:manipulation; }
    .item-controls button.active { color:#061124; background:linear-gradient(135deg,#ffe77c,#ff9f76); }
    .laser-beam { pointer-events:none; }
    .tips { max-width:940px; margin:12px auto 0; display:flex; justify-content:space-between; gap:12px; color:#8fa5c5; font-size:12px; }
    .tips span { padding:7px 10px; border:1px solid var(--line); border-radius:9px; background:#0b1630aa; }
    .touch-controls { display:none; position:absolute; left:16px; bottom:16px; width:132px; height:132px; z-index:3; user-select:none; touch-action:none; }
    .touch-controls button { position:absolute; width:42px; height:42px; padding:0; border:1px solid #b6eaff66; color:#e8fbff; background:#183b70bb; box-shadow:0 4px 14px #0005; font-size:22px; line-height:1; touch-action:none; -webkit-tap-highlight-color:transparent; }
    .touch-controls button:active, .touch-controls button.active { background:#4aa9dccc; transform:scale(.94); }
    .touch-controls .up { left:45px; top:0; } .touch-controls .left { left:0; top:45px; }
    .touch-controls .right { right:0; top:45px; } .touch-controls .down { left:45px; bottom:0; }
    .hide { display:none; }
    @media (max-width:650px) {
      /* 手机：不再强制居中，内容按顺序排，放不下可以滚 */
      body { display:block; overflow:auto; }
      .shell { display:flex; flex-direction:column; width:100%; min-height:100dvh; padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px)); }
      .top { display:block; width:100%; margin:0 0 10px; }
      h1 { font-size:26px; }
      .subtitle { margin-top:4px; font-size:11px; }
      .stats { justify-content:flex-start; gap:6px; margin-top:10px; }
      .stat { flex:1 1 0; min-width:0; padding:6px 8px; }
      .stat small { font-size:10px; }
      .stat b { font-size:16px; }
      .tips { display:none; }

      /* 弹出层改成铺满整屏：卡片放得下，也压不到画布边框、不会被裁掉 */
      .overlay { position:fixed; inset:0; padding:16px; }
      .card { padding:22px 18px; }
      .card h2 { font-size:26px; }
      .card p { font-size:14px; }
      .shop-card { max-height:88dvh; }
      .shop-grid { grid-template-columns:1fr; }

      /* 道具键缩小，挪到右下角的拇指区 */
      .item-controls { position:fixed; top:auto; right:14px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); flex-direction:column; gap:5px; }
      .item-controls button { min-width:0; padding:6px 7px; font-size:11px; }

      /* 方向键钉在屏幕底部正中：拇指够得着，也不挡画面 */
      .touch-controls { position:fixed; left:calc(50% - 66px); bottom:calc(16px + env(safe-area-inset-bottom,0px)); }
    }

    /* 判断"是不是触屏"用 pointer，不能用宽度——否则手机横屏时方向键会整个消失 */
    @media (pointer:coarse) {
      .touch-controls { display:block; }
      /* 没在玩的时候藏起来，免得压住开始/商店/结算弹窗 */
      .game-wrap:not(.playing) .touch-controls { visibility:hidden; }
      .game-wrap:not(.playing) .item-controls { display:none; }
    }

    /* 手机横屏：画布按"高度"撑满（3:2 靠宽度会超出屏幕被裁），按钮浮在两侧空白处 */
    @media (pointer:coarse) and (orientation:landscape) {
      body { display:block; overflow:hidden; height:100dvh; }
      .shell { display:flex; flex-direction:column; height:100dvh; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); }
      .top { display:flex; align-items:center; gap:10px; width:100%; margin:0 0 6px; }
      h1 { font-size:20px; }
      .subtitle { display:none; }
      .stats { margin:0 0 0 auto; gap:6px; }
      .stat { min-width:0; padding:4px 9px; }
      .stat b { font-size:15px; }
      .tips { display:none; }
      .game-wrap { width:min(100%, calc((100dvh - 84px) * 1.5)); margin:auto; }
      .overlay { position:fixed; inset:0; padding:14px; }
      .touch-controls { position:fixed; left:16px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); }
      .item-controls { position:fixed; top:auto; right:16px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); flex-direction:column; gap:5px; }
      .item-controls button { min-width:0; padding:6px 7px; font-size:11px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div><h1>流星突围</h1><div class="subtitle">METEOR DASH · 在宇宙尘埃中活下来</div></div>
      <div class="stats">
        <div class="stat"><small>分数</small><b id="score">0</b></div>
        <div class="stat"><small>最高分</small><b id="best">0</b></div>
        <div class="stat"><small>护盾</small><b id="lives">♥♥♥</b></div>
        <div class="stat"><small>星星</small><b id="stars">★ 0</b></div>
      </div>
    </div>
    <section class="game-wrap">
      <canvas id="game" width="900" height="600" aria-label="流星突围游戏区域"></canvas>
      <div class="touch-controls" aria-label="手机移动控制">
        <button class="up" data-key="ArrowUp" aria-label="向上">▲</button>
        <button class="left" data-key="ArrowLeft" aria-label="向左">◀</button>
        <button class="right" data-key="ArrowRight" aria-label="向右">▶</button>
        <button class="down" data-key="ArrowDown" aria-label="向下">▼</button>
      </div>
      <div class="item-controls" aria-label="游戏道具">
        <button data-use="magnet" title="磁铁：吸引能量晶体">🧲 <span id="magnetCount">0</span></button>
        <button data-use="shield" title="护盾：抵挡一次撞击">🛡️ <span id="shieldCount">0</span></button>
        <button data-use="laser" title="激光：持续清除陨石">⚡ <span id="laserCount">0</span></button>
      </div>
      <div class="overlay" id="startOverlay">
        <div class="card"><h2>准备起飞？</h2><p>驾驶蓝色飞船躲避陨石，收集金色能量晶体。撑得越久，速度越快。</p><div class="wallet">★ <strong id="menuStars">0</strong><button class="shop-open" id="shopBtn">打开星际商店</button></div><div class="difficulty-label">选择难度</div><div class="difficulty-row"><button class="difficulty-btn" data-difficulty="easy">轻松</button><button class="difficulty-btn selected" data-difficulty="normal">标准</button><button class="difficulty-btn" data-difficulty="hard">困难</button></div><button id="startBtn">开始游戏</button></div>
      </div>
      <div class="overlay hide" id="endOverlay">
        <div class="card"><h2 id="endTitle">飞船失联</h2><p>本次航行得分：<strong id="finalScore">0</strong><br>本局获得星星：<strong id="earnedStars">0</strong><br><span id="endHint">再来一次，争取冲上排行榜。</span></p><button id="againBtn">重新起飞</button> <button class="shop-open" id="shopFromEndBtn">打开商店</button></div>
      </div>
      <div class="overlay hide" id="shopOverlay">
        <div class="card shop-card"><h2>星际商店</h2><p class="shop-subtitle">星星会永久保存。购买后，皮肤可切换，道具可在游戏中使用。</p><div class="wallet">★ <strong id="shopStars">0</strong></div><div class="shop-grid" id="shopGrid"></div><button class="shop-close" id="closeShopBtn">返回</button></div>
      </div>
    </section>
    <div class="tips"><span>电脑：WASD / 方向键 · 手机：屏幕方向键</span><span>暂停：P</span><span>收集晶体 +25 · 撞击 -1 护盾</span></div>
  </main>
<script>
(() => {
  const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
  const scoreEl = document.querySelector('#score'), bestEl = document.querySelector('#best'), livesEl = document.querySelector('#lives');
  const startOverlay = document.querySelector('#startOverlay'), endOverlay = document.querySelector('#endOverlay');
  const shopOverlay = document.querySelector('#shopOverlay'), shopGrid = document.querySelector('#shopGrid');
  const finalScore = document.querySelector('#finalScore'), earnedStarsEl = document.querySelector('#earnedStars'), endTitle = document.querySelector('#endTitle'), endHint = document.querySelector('#endHint');
  const W = canvas.width, H = canvas.height, keys = new Set();
  const skinConfigs = {
    cyan: { name:'极光蓝', body:'#75e8ff', glow:'#4ddaff', window:'#15296b', flame:'#fff3a8' },
    ruby: { name:'赤焰红', body:'#ff7187', glow:'#ff4d72', window:'#5e163e', flame:'#ffd06b' },
    gold: { name:'黄金彗星', body:'#ffe477', glow:'#ffb52e', window:'#704c19', flame:'#fff7c2' },
    nebula: { name:'星云紫', body:'#c69bff', glow:'#a45cff', window:'#321a68', flame:'#a9fff5' }
  };
  const shopItems = [
    { id:'ruby', type:'skin', name:'赤焰红皮肤', desc:'像一颗穿过夜空的火流星。', price:35 },
    { id:'gold', type:'skin', name:'黄金彗星皮肤', desc:'金色飞船，闪耀着财富的光。', price:70 },
    { id:'nebula', type:'skin', name:'星云紫皮肤', desc:'来自深空的神秘配色。', price:120 },
    { id:'magnet', type:'item', name:'磁力核心', desc:'使用后持续 8 秒，自动吸引能量晶体。', price:18 },
    { id:'shield', type:'item', name:'备用护盾', desc:'使用后抵挡下一次陨石撞击。', price:24 },
    { id:'laser', type:'item', name:'轨道激光', desc:'使用后持续 6 秒，自动摧毁飞船前方的陨石。', price:30 }
  ];
  const readJSON = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key) || 'null') ?? fallback; } catch { return fallback; } };
  let stars = Number(localStorage.getItem('meteorDashStars') || 0);
  let ownedSkins = readJSON('meteorDashOwnedSkins', ['cyan']);
  let inventory = readJSON('meteorDashInventory', { magnet:0, shield:0, laser:0 });
  let currentSkin = localStorage.getItem('meteorDashSkin') || 'cyan';
  let shopReturn = 'menu', collectedOrbs = 0, earnedStars = 0, shieldCharges = 0;
  const active = { magnet:0, laser:0 };
  const powerupButtons = document.querySelectorAll('.item-controls button');
  const difficultyConfigs = {
    easy: { label:'轻松', speed:.78, spawnBase:1.04, spawnScale:1.18, minSpawn:.48, extraChance:0 },
    normal: { label:'标准', speed:1, spawnBase:.82, spawnScale:1, minSpawn:.24, extraChance:.08 },
    hard: { label:'困难', speed:1.36, spawnBase:.66, spawnScale:.82, minSpawn:.16, extraChance:.38 }
  };
  let difficulty = 'normal';
  let state = 'menu', last = 0, score = 0, best = Number(localStorage.getItem('meteorDashBest') || 0), lives = 3, elapsed = 0, spawn = 0, orbSpawn = 0, shake = 0;
  bestEl.textContent = best;
  const ship = { x: W/2, y:H-90, r:18, vx:0, vy:0 };
  let meteors = [], orbs = [], particles = [], starfield = [];
  for (let i=0;i<110;i++) starfield.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1.5+.4, tw:Math.random()*6.28});
  const rnd = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  function saveProgress() { localStorage.setItem('meteorDashStars',String(stars)); localStorage.setItem('meteorDashOwnedSkins',JSON.stringify(ownedSkins)); localStorage.setItem('meteorDashInventory',JSON.stringify(inventory)); localStorage.setItem('meteorDashSkin',currentSkin); }
  function updateWallet() {
    document.querySelector('#stars').textContent=`★ ${stars}`; document.querySelector('#menuStars').textContent=stars; document.querySelector('#shopStars').textContent=stars;
    document.querySelector('#magnetCount').textContent=inventory.magnet; document.querySelector('#shieldCount').textContent=inventory.shield; document.querySelector('#laserCount').textContent=inventory.laser;
  }
  function renderShop() {
    shopGrid.innerHTML=shopItems.map(item=>{
      const owned=item.type==='skin' && ownedSkins.includes(item.id), equipped=item.id===currentSkin, count=item.type==='item'?inventory[item.id]:0;
      let label=item.type==='skin'?(equipped?'使用中':owned?'装备':`购买 · ${item.price}★`):`购买 · ${item.price}★`;
      const disabled=(item.type==='skin'&&equipped)||(item.type==='item'&&stars<item.price)||(item.type==='skin'&&!owned&&stars<item.price);
      return `<div class="shop-item"><h3>${item.name}</h3><p>${item.desc}<br>${item.type==='item'?`已有：${count} 个 · `:''}<span class="price">${item.type==='skin'&&owned?'已拥有':`${item.price}★`}</span></p><button data-shop-id="${item.id}" ${disabled?'disabled':''}>${label}</button></div>`;
    }).join('');
    shopGrid.querySelectorAll('[data-shop-id]').forEach(btn=>btn.addEventListener('click',()=>buyShopItem(btn.dataset.shopId)));
  }
  function buyShopItem(id) {
    const item=shopItems.find(entry=>entry.id===id); if(!item) return;
    if(item.type==='skin' && ownedSkins.includes(id)){currentSkin=id;saveProgress();renderShop();return;}
    if(stars<item.price) return;
    stars-=item.price;
    if(item.type==='skin') ownedSkins.push(id); else inventory[id]=(inventory[id]||0)+1;
    saveProgress(); updateWallet(); renderShop();
  }
  function openShop(returnTo) { shopReturn=returnTo; startOverlay.classList.add('hide'); endOverlay.classList.add('hide'); shopOverlay.classList.remove('hide'); updateWallet(); renderShop(); }
  function closeShop() { shopOverlay.classList.add('hide'); (shopReturn==='end'?endOverlay:startOverlay).classList.remove('hide'); updateWallet(); }
  function updatePowerupUI() { updateWallet(); powerupButtons.forEach(btn=>btn.classList.toggle('active',active[btn.dataset.use]>0)); }
  function usePowerup(id) {
    if(state!=='playing' || !inventory[id]) return;
    inventory[id]--;
    if(id==='magnet') active.magnet=8;
    if(id==='shield') shieldCharges++;
    if(id==='laser') active.laser=6;
    saveProgress(); updatePowerupUI();
  }
  function reset() { score=0; lives=3; elapsed=0; spawn=0; orbSpawn=0; shake=0; collectedOrbs=0; earnedStars=0; shieldCharges=0; active.magnet=0; active.laser=0; meteors=[]; orbs=[]; particles=[]; ship.x=W/2; ship.y=H-90; scoreEl.textContent=0; livesEl.textContent='♥♥♥'; updatePowerupUI(); }
  function burst(x,y,color,n=16) { for(let i=0;i<n;i++) particles.push({x,y,vx:rnd(-140,140),vy:rnd(-140,140),life:rnd(.35,.8),max:.8,color,size:rnd(2,5)}); }
  function addMeteor() { const cfg=difficultyConfigs[difficulty], r=rnd(14,29), speed=(rnd(95,155)+elapsed*2.4)*cfg.speed; meteors.push({x:rnd(r,W-r),y:-r-10,r,vx:rnd(-28,28),vy:speed,rot:rnd(0,7),spin:rnd(-2,2), hue:rnd(8,30)}); }
  function addOrb() { orbs.push({x:rnd(30,W-30),y:-20,r:10,vy:rnd(75,115)+elapsed*1.4,pulse:rnd(0,7)}); }
  function hit(a,b) { return Math.hypot(a.x-b.x,a.y-b.y) < a.r+b.r; }
  function start() { reset(); state='playing'; document.querySelector('.game-wrap').classList.add('playing'); startOverlay.classList.add('hide'); endOverlay.classList.add('hide'); last=performance.now(); requestAnimationFrame(loop); }
  function finish() { state='ended'; document.querySelector('.game-wrap').classList.remove('playing'); earnedStars=Math.max(1,Math.floor(score/120)+collectedOrbs); stars+=earnedStars; saveProgress(); updateWallet(); best=Math.max(best,score); localStorage.setItem('meteorDashBest',best); bestEl.textContent=best; finalScore.textContent=score; earnedStarsEl.textContent=earnedStars; endTitle.textContent=score>=1000?'星际传奇': '飞船失联'; endHint.textContent=score>=1000?'你已经成为这片星域的传说。':'再来一次，争取冲上排行榜。'; endOverlay.classList.remove('hide'); }
  function update(dt) {
    if(state!=='playing') return;
    elapsed += dt; const moveSpeed=320, response=6, cfg=difficultyConfigs[difficulty];
    active.magnet=Math.max(0,active.magnet-dt); active.laser=Math.max(0,active.laser-dt);
    let ax=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);
    let ay=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);
    ship.vx += (ax*moveSpeed-ship.vx)*Math.min(1,response*dt); ship.vy += (ay*moveSpeed-ship.vy)*Math.min(1,response*dt);
    ship.vx=clamp(ship.vx,-moveSpeed,moveSpeed); ship.vy=clamp(ship.vy,-moveSpeed,moveSpeed); ship.x=clamp(ship.x+ship.vx*dt,25,W-25); ship.y=clamp(ship.y+ship.vy*dt,35,H-30);
    spawn-=dt; orbSpawn-=dt; if(spawn<=0){addMeteor();if(Math.random()<cfg.extraChance)addMeteor();spawn=Math.max(cfg.minSpawn,(cfg.spawnBase-elapsed*.008)*cfg.spawnScale);} if(orbSpawn<=0){addOrb();orbSpawn=rnd(1.2,2.4);}
    meteors.forEach(m=>{m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.spin*dt;});
    orbs.forEach(o=>{if(active.magnet>0){o.x+=(ship.x-o.x)*dt*4.5;o.y+=(ship.y-o.y)*dt*4.5;}o.y+=o.vy*dt;});
    if(active.laser>0) for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];if(m.y<ship.y&&Math.abs(m.x-ship.x)<m.r+16){meteors.splice(i,1);score+=10;burst(m.x,m.y,'#aefcff',20);}}
    meteors=meteors.filter(m=>m.y<H+50); orbs=orbs.filter(o=>o.y<H+30);
    for(let i=meteors.length-1;i>=0;i--) if(hit(ship,meteors[i])) { const m=meteors.splice(i,1)[0]; if(shieldCharges>0){shieldCharges--;burst(m.x,m.y,'#83ffca',28);updatePowerupUI();continue;} burst(m.x,m.y,'#ff785f',24); lives--; shake=.3; livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives); if(lives<=0){finish();return;} }
    for(let i=orbs.length-1;i>=0;i--) if(hit(ship,orbs[i])) { const o=orbs.splice(i,1)[0]; collectedOrbs++; score+=25; burst(o.x,o.y,'#ffe36e',18); scoreEl.textContent=score; }
    score += Math.floor(dt*3); scoreEl.textContent=score;
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;}); particles=particles.filter(p=>p.life>0); shake=Math.max(0,shake-dt);
  }
  function draw() {
    ctx.save(); if(shake) ctx.translate(rnd(-5,5)*shake/.3,rnd(-5,5)*shake/.3);
    const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#070c23');grad.addColorStop(1,'#10133a');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#79bfff12';ctx.lineWidth=1; for(let x=30;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();} for(let y=30;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    starfield.forEach(s=>{s.y += (15+s.z*22)*((state==='playing')?1:0.2)/60;if(s.y>H)s.y=0;ctx.fillStyle=`rgba(190,225,255,${.25+.35*Math.sin(s.tw+elapsed*2)})`;ctx.fillRect(s.x,s.y,s.z*1.8,s.z*1.8);});
    orbs.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);const glow=ctx.createRadialGradient(0,0,1,0,0,22);glow.addColorStop(0,'#fff8a8');glow.addColorStop(1,'#ffd44c00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();ctx.rotate(elapsed*2+o.pulse);ctx.fillStyle='#ffe45f';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,0);ctx.lineTo(0,10);ctx.lineTo(-8,0);ctx.closePath();ctx.fill();ctx.restore();});
    meteors.forEach(m=>{ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);ctx.shadowBlur=18;ctx.shadowColor='#ff603f88';ctx.fillStyle=`hsl(${m.hue} 90% 62%)`;ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,rr=m.r*rnd(.78,1.14);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#8e2d44';ctx.beginPath();ctx.arc(-m.r*.25,-m.r*.1,m.r*.18,0,7);ctx.fill();ctx.restore();});
    if(active.laser>0){ctx.save();ctx.globalAlpha=.7;ctx.strokeStyle='#aefcff';ctx.shadowBlur=18;ctx.shadowColor='#57f4ff';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(ship.x,ship.y-16);ctx.lineTo(ship.x,0);ctx.stroke();ctx.globalAlpha=.95;ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ship.x,ship.y-16);ctx.lineTo(ship.x,0);ctx.stroke();ctx.restore();}
    particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();});ctx.globalAlpha=1;
    const skin=skinConfigs[currentSkin]||skinConfigs.cyan; ctx.save();ctx.translate(ship.x,ship.y);const glow=ctx.createRadialGradient(0,0,2,0,0,38);glow.addColorStop(0,skin.glow+'88');glow.addColorStop(1,'#32bfff00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,40,0,7);ctx.fill();ctx.shadowBlur=18;ctx.shadowColor=skin.glow;ctx.fillStyle=skin.body;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(17,17);ctx.lineTo(0,11);ctx.lineTo(-17,17);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=skin.window;ctx.beginPath();ctx.ellipse(0,-6,7,10,0,0,7);ctx.fill();ctx.fillStyle=skin.flame;ctx.beginPath();ctx.moveTo(-5,17);ctx.lineTo(0,29+rnd(0,5));ctx.lineTo(5,17);ctx.closePath();ctx.fill();ctx.restore();ctx.restore();
  }
  function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();if(state==='playing')requestAnimationFrame(loop);}
  document.querySelector('#startBtn').onclick=start; document.querySelector('#againBtn').onclick=start;
  document.querySelector('#shopBtn').onclick=()=>openShop('menu'); document.querySelector('#shopFromEndBtn').onclick=()=>openShop('end'); document.querySelector('#closeShopBtn').onclick=closeShop;
  document.querySelectorAll('.difficulty-btn').forEach(btn=>btn.addEventListener('click',()=>{difficulty=btn.dataset.difficulty;document.querySelectorAll('.difficulty-btn').forEach(b=>b.classList.toggle('selected',b===btn));}));
  powerupButtons.forEach(btn=>btn.addEventListener('click',()=>usePowerup(btn.dataset.use)));
  document.querySelectorAll('.touch-controls button').forEach(btn=>{
    const key=btn.dataset.key;
    const press=e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);btn.classList.add('active');keys.add(key);};
    const release=e=>{e.preventDefault();btn.classList.remove('active');keys.delete(key);};
    btn.addEventListener('pointerdown',press); btn.addEventListener('pointerup',release); btn.addEventListener('pointercancel',release); btn.addEventListener('lostpointercapture',release);
  });
  window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(k==='1')usePowerup('magnet');if(k==='2')usePowerup('shield');if(k==='3')usePowerup('laser');if(k==='p'&&state!=='menu'&&state!=='ended'){state=state==='playing'?'paused':'playing';if(state==='playing'){last=performance.now();requestAnimationFrame(loop);}}keys.add(k);});
  window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
  updateWallet();
  draw();
})();
</script>
</body>
</html>
